[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "joule-ble"
version = "0.1.0a1"
description = "Python library for ChefSteps and Breville Joule sous vide devices over Bluetooth Low Energy"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Home Assistant Community" }
]
keywords = ["bluetooth", "ble", "sous-vide", "joule", "chefsteps", "breville", "home-assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "bleak>=0.21.0",
    "bleak-retry-connector>=3.5.0",
    "bluetooth-data-tools>=1.19.0",
    "protobuf>=4.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [
    "src/joule_ble/proto/*_pb2.*",
    "extracted",
    "Breville++Cooking_*",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "B008",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
exclude = [
    "extracted",
    "Breville\\+\\+Cooking_.*",
]

[[tool.mypy.overrides]]
module = [
    "google.protobuf.*",
    "joule_ble.proto.*",
]
ignore_missing_imports = true
ignore_errors = true
